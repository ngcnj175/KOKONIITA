name = "kiokupin-api"
main = "src/index.js"
compatibility_date = "2025-01-15"
workers_dev = true

# フロントエンドのオリジン（GitHub Pagesなど）
[vars]
FRONTEND_ORIGIN = "https://ngcnj175.github.io"
FRONTEND_URL = "https://ngcnj175.github.io/kioku-pin/"
# 例: https://kiokupin-api.<your-subdomain>.workers.dev/api/auth/google/callback
GOOGLE_REDIRECT_URI = "https://kiokupin-api.ngcnj175.workers.dev/api/auth/google/callback"
# 管理画面（星の記録）へのアクセスを許可するメール（カンマ区切り）
ADMIN_EMAILS = "ngcnj175@ybb.ne.jp"

# --- D1 (SQLite) ---
# `wrangler d1 create kiokupin` で作成後、出力の database_id を貼る
[[d1_databases]]
binding = "DB"
database_name = "kiokupin"
database_id = "740b7e9a-d94d-4219-ae04-ac959991d82d"

# --- KV (セッション) ---
# `wrangler kv namespace create kiokupin-sessions` で作成後、id を貼る
[[kv_namespaces]]
binding = "SESSIONS"
id = "f072edcb8112473d9b53274ed95c4cc0"

# シークレット（wrangler secret put で設定）:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
